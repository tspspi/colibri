[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colibrialbate"
version = "0.1.0"
description = "Activation ablation tooling for colibri GLM models"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.scripts]
colibrialbate = "colibrialbate.cli:main"

[tool.setuptools]
packages = ["colibrialbate"]

